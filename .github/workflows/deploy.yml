name: Deploy to GitHub Pages

on:
  # Publica cada vez que hay un push a la rama master
  push:
    branches: [master]
  # Permite lanzarlo a mano desde la pestaña Actions de GitHub
  workflow_dispatch:

# Permisos para leer el repositorio y publicar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      - name: Install, build, and upload your site
        uses: withastro/action@v3
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4